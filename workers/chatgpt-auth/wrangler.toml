name = "chatgpt-auth"
main = "src/index.ts"
compatibility_date = "2026-02-14"

# Refresh check window is 1 hour; run 4x more frequently.
[triggers]
crons = ["*/15 * * * *"]

[observability]
# Enable Workers Observability (logs + traces).
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[[d1_databases]]
binding = "CHATGPT_AUTH_DB"
database_name = "chatgpt-auth"
database_id = "00000000-0000-0000-0000-000000000000"
remote = true

[[kv_namespaces]]
binding = "CHATGPT_AUTH_KV"
id = "623ac725dd4444ac85bbea9a41dc2b6b"
remote = true
